<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>MedCred — Verified Doctor & Nurse Network | Medical Credential Verification</title>
    <meta name="description" content="MedCred is an online medical assistance platform. Check that a doctor or nurse holds a current licence, take online consultations, and keep digital prescriptions in one place." />
    <meta name="theme-color" content="#c8102e" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MedCred — Verified Doctor & Nurse Network" />
    <meta property="og:description" content="The trust infrastructure for verified medical professionals. Instantly verify doctor credentials, schedule consultations, and manage digital prescriptions." />
    <meta property="og:image" content="/assets/hero-bg.png" />
    <meta property="og:url" content="https://medcred.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedCred — Verified Doctor & Nurse Network" />
    <meta name="twitter:description" content="The trust infrastructure for verified medical professionals." />
    <meta name="twitter:image" content="/assets/hero-bg.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c8102e'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='white'>⚕</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50">
    <div id="root">
      <div id="app-init-loader" style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--t-bg, #f5faff); font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="position: relative; width: 88px; height: 88px; margin-bottom: 20px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="88" height="88" fill="none">
            <defs>
              <linearGradient id="init-glow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--t-600, #0284c7)" />
                <stop offset="100%" stop-color="var(--t-700, #0369a1)" />
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="54" stroke="var(--t-200, #bae6fd)" stroke-width="2.5" opacity="0.65" />
            <rect x="18" y="18" width="84" height="84" rx="20" fill="url(#init-glow)" />
            <rect x="22" y="22" width="76" height="76" rx="16" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
            <path d="M51 36h18v15h15v18H69v15H51V69H36V51h15V36z" fill="#ffffff" />
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="2.4s" repeatCount="indefinite" />
              <circle cx="60" cy="60" r="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 250" opacity="0.95" />
              <circle cx="106" cy="60" r="4" fill="var(--e-600, #10b981)" stroke="#ffffff" stroke-width="1.5" />
            </g>
          </svg>
        </div>
        <div style="font-size: 18px; font-weight: 800; color: var(--ink, #0f172a); letter-spacing: -0.02em; margin-bottom: 6px;">
          MedCred<span style="color: var(--t-600, #0284c7);">.</span>
        </div>
        <div style="font-size: 12px; font-weight: 600; color: var(--ink-2, #64748b); letter-spacing: 0.08em; text-transform: uppercase;">
          Connecting to Medical Network…
        </div>
      </div>
    </div>
    <script>
      try {
        var t = localStorage.getItem('medcred-theme');
        if (t === 'green' || t === 'teal') t = 'sky';
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
