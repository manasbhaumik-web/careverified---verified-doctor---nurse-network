<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>MediCred — Verified Doctor & Nurse Network | Medical Credential Verification</title>
    <meta name="description" content="MediCred is an online medical assistance platform. Check that a doctor or nurse holds a current licence, take online consultations, and keep digital prescriptions in one place." />
    <meta name="theme-color" content="#0A7A63" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MediCred — Verified Doctor & Nurse Network" />
    <meta property="og:description" content="The trust infrastructure for verified medical professionals. Instantly verify doctor credentials, schedule consultations, and manage digital prescriptions." />
    <meta property="og:image" content="/assets/hero-bg.png" />
    <meta property="og:url" content="https://medicred.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediCred — Verified Doctor & Nurse Network" />
    <meta name="twitter:description" content="The trust infrastructure for verified medical professionals." />
    <meta name="twitter:image" content="/assets/hero-bg.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c8102e'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='white'>⚕</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50">
    <div id="root">
      <div id="app-init-loader" style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--t-bg, #f5faff); font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="position: relative; width: 88px; height: 88px; margin-bottom: 20px;">
          <style>
            @keyframes brand-load-draw { 0% { stroke-dashoffset: 1; } 60%, 100% { stroke-dashoffset: 0; } }
            @keyframes brand-load-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
            #app-init-loader .brand-load-pulse { stroke-dasharray: 1; animation: brand-load-draw 1.8s ease-in-out infinite; }
            #app-init-loader .brand-load-shield { transform-box: fill-box; transform-origin: center; animation: brand-load-breathe 1.8s ease-in-out infinite; }
            @media (prefers-reduced-motion: reduce) { #app-init-loader .brand-load-pulse, #app-init-loader .brand-load-shield { animation: none; stroke-dashoffset: 0; } }
          </style>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="88" height="88" fill="none" role="img" aria-label="MediCred">
            <g class="brand-load-shield"><path d="M24 3 40 9v13c0 10-7 18-16 23C15 40 8 32 8 22V9z" fill="var(--t-600, #0A7A63)" /></g>
            <path class="brand-load-pulse" pathLength="1" d="M13 26h5.5l3-9.5 5 15.5 3.5-10 1.5 4H35" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="36" cy="38" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
            <path d="m32.5 38 2.5 2.5 4.5-5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div style="font-size: 18px; font-weight: 800; color: var(--ink, #0f172a); letter-spacing: -0.02em; margin-bottom: 6px;">
          Medi<span style="color: var(--t-600, #0A7A63);">Cred</span>
        </div>
        <div style="font-size: 12px; font-weight: 600; color: var(--ink-2, #64748b); letter-spacing: 0.08em; text-transform: uppercase;">
          Connecting to Medical Network…
        </div>
      </div>
    </div>
    <script>
      try {
        var t = localStorage.getItem('medcred-theme-v3');
        if (t === 'lagoon') t = 'ice-mint';
        if (t !== 'ice-mint' && t !== 'light-cyan' && t !== 'sky') t = 'ice-mint';
        document.documentElement.setAttribute('data-theme', t);
        var f = localStorage.getItem('medcred-font-v1');
        var validFonts = ['dm-sans', 'clinical-precision', 'swiss-architectural', 'hospital-enterprise', 'compact-geometric', 'modern-medtech'];
        if (validFonts.indexOf(f) === -1) f = 'dm-sans';
        document.documentElement.setAttribute('data-font', f);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
